services:
  labsense-db:
    image: postgres:16
    container_name: labsense-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: labsense
      POSTGRES_PASSWORD: labsense_dev
      POSTGRES_DB: labsense
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labsense -d labsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  labsense-pgadmin:
    image: dpage/pgadmin4
    container_name: labsense-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@labsense.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      labsense-db:
        condition: service_healthy

volumes:
  pgdata:
